<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CineSearch</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- Header - Logo and navigation -->    
    <header>
        <div class="logo">Cine<span>Search</span> 🎬</div>
        <nav>
            <ul>
                <li><a href="#" onclick="showHome(event)" aria-label="Go to home page">Home</a></li>
                <li><a href="#" onclick="showReview(event)" aria-label="Go to review section">Review</a></li>
                <li><a href="#" onclick="showSignUp(event)" aria-label="Go to sign up">Sign Up</a></li>
            </ul>
        </nav>
    </header>
    <main>
        <!-- Search section - Search bar and form -->
        <section class="search-section">
            <h1>Every Film, Every Genre, One Search</h1>
            <form id="search-form">
                <input type="text" id="search-input" placeholder="Search for movies..." aria-label="Search for a film">
                <button id="search-button" type="submit" aria-label="Search for films">Search</button>
            </form>
        </section>
        <!-- Trending section - popular films grid and year filter -->
        <section id="trending-section-container" class="trending-movies">
            <div id="trending-section">
                <h2>Trending Movies</h2>
            </div>
            <select id="year-select">
                <option value="">All Recent Films</option>
                <option value="2024">2024</option>
                <option value="2025">2025</option>
                <option value="2026">2026</option>
            </select>
            <div id="trending-movies"></div>
        </section>
        <!-- Results section - Search results grid -->
        <section class="results-section">
            <h2 id="search-header">Search Results</h2>
            <div id="results"></div>
        </section>
        <!-- Detail section - individual film details -->
        <section id="detail-section">
            <div id="movie-details"></div>
        </section>
        <!-- Sign up section - user registration form -->
        <section id="signup-section" class="hidden">
            <h2>Sign Up</h2>
            <form id="signup-form">
                <div class="sign-up">
                    <label for="fname">First Name:</label>
                    <input type="text" id="fname" name="fname" required>

                    <label for="lname">Last Name:</label>
                    <input type="text" id="lname" name="lname" required>

                    <label for="signup-email">Email:</label>
                    <input type="email" id="signup-email" name="email" required>

                    <label for="password">Password:</label>
                    <input type="password" id="password" name="password" required minlength="8">

                    <label for="genre">Favourite Genre:</label>
                    <select id="genre" name="genre">
                        <option value="">Select a genre...</option>
                        <option value="action">Action</option>
                        <option value="comedy">Comedy</option>
                        <option value="drama">Drama</option>
                        <option value="horror">Horror</option>
                        <option value="sci-fi">Sci-Fi</option>
                        <option value="thriller">Thriller</option>
                    </select>

                    <div class="checkbox-group">
                        <input type="checkbox" id="subscription" name="subscription">
                        <label for="subscription">Subscribe to newsletter</label>
                    </div>

                    <div class="checkbox-group">
                        <input type="checkbox" id="terms" name="terms">
                        <label for="terms">I agree to terms and conditions</label>
                    </div>

                    <button type="submit">Sign Up</button>
                </div>
            </form>
        </section>
        <!-- Review section - film review form -->
        <section id="review-section" class="hidden">
            <form id="review-form" class="review-form">
                <h3>Review Form</h3>
                <p>Submit a rating below for a film of your choice!</p>
                <div id="film-review">
                    <label for="film-title"><strong>Film Title:</strong></label>
                    <input type="text" id="film-title" name="film-title">
                    <label for="ratings1">1⭐️</label>
                    <input type="radio" id="ratings1" name="rating" value="1" class="rating-input">
                    <label for="ratings2">2⭐️</label>
                    <input type="radio" id="ratings2" name="rating" value="2" class="rating-input">
                    <label for="ratings3">3⭐️</label>
                    <input type="radio" id="ratings3" name="rating" value="3" class="rating-input">
                    <label for="ratings4">4⭐️</label>
                    <input type="radio" id="ratings4" name="rating" value="4" class="rating-input">
                    <label for="ratings5">5⭐️</label>
                    <input type="radio" id="ratings5" name="rating" value="5" class="rating-input">
                    <label for="review-message" class="review-label"><strong>Message (Optional):</strong></label>
                    <textarea id="review-message" name="message" maxlength="500" placeholder="Max 500 characters"></textarea>
                </div>
                <h4>Reviewer's Details</h4>
                <div id="review-details">
                    <label for="firstname">First Name:</label>
                    <input type="text" id="firstname" name="firstname" required>
                    <label for="lastname">Last Name:</label>
                    <input type="text" id="lastname" name="lastname" required>
                    <label for="review-email">Email:</label>
                    <input type="email" id="review-email" name="email" required>
                </div>
                <button class="review-submit" type="submit" aria-label="Submit rating">Submit rating</button>
            </form>
        </section>
    </main>
    <footer>
        <p>&copy; 2026 CineSearch — All rights reserved</p>
        <p>Powered by <a href="https://www.omdbapi.com" target="_blank">OMDb API</a></p>
    </footer>
    <script src="index.js"></script>
</body>
</html>
